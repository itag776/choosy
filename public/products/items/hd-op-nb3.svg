<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091210"/>
      <stop offset="100%" stop-color="#132820"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="135" r="125" fill="url(#glow)"/>

  <!-- Sound Waves / Frequency visualization rings -->
  <circle cx="200" cy="135" r="85" stroke="#34d399" stroke-opacity="0.1" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
  <circle cx="200" cy="135" r="105" stroke="#34d399" stroke-opacity="0.06" stroke-width="1" fill="none"/>

  
  <!-- EARBUDS / IN-EAR GRAPHIC -->
  <g transform="translate(130, 60)" filter="url(#shadow)">
    <!-- Charging Case -->
    <rect x="35" y="45" width="70" height="52" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="36" y1="62" x2="104" y2="62" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="70" cy="74" r="2.5" fill="#34d399"/>

    <!-- Left Earbud -->
    <g transform="translate(12, 10)">
      <rect x="14" y="24" width="7" height="32" rx="3.5" fill="#334155"/>
      <ellipse cx="17.5" cy="20" rx="12" ry="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <ellipse cx="23" cy="18" rx="6" ry="8" fill="#0f172a"/>
      <ellipse cx="27" cy="18" rx="4" ry="6" fill="#34d399" fill-opacity="0.6"/>
    </g>

    <!-- Right Earbud -->
    <g transform="translate(86, 10)">
      <rect x="14" y="24" width="7" height="32" rx="3.5" fill="#334155"/>
      <ellipse cx="17.5" cy="20" rx="12" ry="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <ellipse cx="12" cy="18" rx="6" ry="8" fill="#0f172a"/>
      <ellipse cx="8" cy="18" rx="4" ry="6" fill="#34d399" fill-opacity="0.6"/>
    </g>

    
  </g>
  

  <!-- Brand watermark/badge (Top Left) -->
  <g transform="translate(24, 30)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" letter-spacing="2">ONEPLUS</text>
  </g>

  <!-- Audio Spec Badge (Top Right) -->
  <g transform="translate(305, 22)">
    <rect width="71" height="18" rx="9" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="35.5" y="12.5" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.5">TWS AUDIO</text>
  </g>

  <!-- Bottom Info Section -->
  <g transform="translate(24, 256)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="700" letter-spacing="-0.3">OnePlus Nord Buds 3</text>
    <text x="0" y="18" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="500">Active Noise Cancellation</text>
  </g>
</svg>