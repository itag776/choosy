<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b120f"/>
      <stop offset="100%" stop-color="#152820"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="upperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="140" r="130" fill="url(#glow)"/>

  <!-- Motion streak trails -->
  <path d="M 30 185 L 370 185" stroke="#10b981" stroke-opacity="0.1" stroke-width="1.5"/>
  <path d="M 50 195 L 350 195" stroke="#10b981" stroke-opacity="0.06" stroke-width="1"/>
  
  <!-- Topographic contour lines for Trail -->
  <path d="M 30 140 Q 120 120 200 130 T 370 120" fill="none" stroke="#10b981" stroke-opacity="0.08" stroke-width="1.5"/>
  <path d="M 20 160 Q 130 140 220 150 T 380 140" fill="none" stroke="#10b981" stroke-opacity="0.05" stroke-width="1"/>
  

  <!-- RUNNING SHOE GRAPHIC -->
  <g transform="translate(75, 75)" filter="url(#shadow)">
    <!-- Outsole Rubber Lugs / Tread -->
    <path d="M 12 108 L 238 108 Q 248 108 245 102 L 230 102 L 18 102 Z" fill="#0f172a"/>
    
    <!-- Aggressive Trail Lugs -->
    <g fill="#020617">
      <polygon points="30,108 36,112 42,108"/>
      <polygon points="60,108 66,112 72,108"/>
      <polygon points="90,108 96,112 102,108"/>
      <polygon points="120,108 126,112 132,108"/>
      <polygon points="150,108 156,112 162,108"/>
      <polygon points="180,108 186,112 192,108"/>
      <polygon points="210,108 216,112 222,108"/>
    </g>
    

    <!-- Midsole Foam (High Stack Cushioning) -->
    <path d="M 10 102 Q 35 104 70 102 Q 130 100 180 102 Q 220 103 242 98 Q 252 82 245 74 Q 230 76 215 78 Q 160 80 110 82 Q 50 82 15 86 Q 8 92 10 102 Z" fill="url(#soleGrad)"/>
    <!-- Midsole Accent Line / Carbon Plate Reveal -->
    <path d="M 22 93 Q 110 88 180 88 Q 215 88 238 84" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Shoe Upper -->
    <path d="M 15 86 Q 18 62 38 48 Q 55 36 78 48 Q 95 36 125 40 Q 155 45 185 55 Q 215 65 240 76 Q 225 78 180 80 Q 110 82 15 86 Z" fill="url(#upperGrad)"/>

    <!-- Heel Collar & Cushioning -->
    <path d="M 38 48 Q 48 38 65 42 Q 78 46 76 52 Q 62 56 46 56 Z" fill="#0f172a"/>

    <!-- Lacing System & Eyestay -->
    <path d="M 105 40 L 165 52" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>
    <path d="M 112 44 L 122 52" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <path d="M 128 47 L 138 55" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <path d="M 144 50 L 154 58" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

    <!-- Brand Signature Stroke / Emblem -->
    <path d="M 80 65 Q 120 72 165 60 Q 140 75 90 76 Z" fill="#10b981" fill-opacity="0.9"/>

    <!-- Toe Cap Reinforcement -->
    <path d="M 220 74 Q 240 76 242 82 L 230 84 Q 215 78 220 74 Z" fill="#0f172a" opacity="0.6"/>
  </g>

  <!-- Brand watermark/badge (Top Left) -->
  <g transform="translate(24, 30)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" letter-spacing="2">KIPRUN</text>
  </g>

  <!-- Terrain Badge (Top Right) -->
  <g transform="translate(305, 22)">
    <rect width="71" height="18" rx="9" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="35.5" y="12.5" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.5">TRAIL RUN</text>
  </g>

  <!-- Bottom Info Section -->
  <g transform="translate(24, 256)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="700" letter-spacing="-0.3">KIPRUN JF 190 Grip</text>
    <text x="0" y="18" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="500">Decathlon Cushion • Long-Life Sole</text>
  </g>
</svg>