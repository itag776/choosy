<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091118"/>
      <stop offset="100%" stop-color="#142536"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="140" r="130" fill="url(#glow)"/>

  <!-- Subtle ambient grid/lines -->
  <path d="M 50 140 Q 200 120 350 140" stroke="#f97316" stroke-opacity="0.12" stroke-width="1.5" fill="none"/>
  <path d="M 40 160 Q 200 135 360 160" stroke="#f97316" stroke-opacity="0.08" stroke-width="1" fill="none"/>

  <!-- Phone Graphic -->
  <g transform="translate(145, 42)" filter="url(#shadow)">
    <!-- Outer Frame -->
    <rect x="0" y="0" width="110" height="195" rx="18" fill="url(#frame)"/>
    <!-- Inner Bezel -->
    <rect x="2.5" y="2.5" width="105" height="190" rx="16.5" fill="#020617"/>
    <!-- Screen -->
    <rect x="5" y="5" width="100" height="185" rx="14" fill="url(#screen)"/>

    <!-- Screen Wallpaper Graphic -->
    <circle cx="50" cy="80" r="36" fill="#f97316" fill-opacity="0.2"/>
    <path d="M 15 140 C 35 110, 65 160, 95 125 L 95 185 L 5 185 Z" fill="#f97316" fill-opacity="0.15"/>

    <!-- Camera Cutout -->
    <circle cx="50" cy="13" r="3" fill="#000"/>
       <circle cx="50" cy="13" r="1.2" fill="#334155"/>

    <!-- Speaker Slit -->
    <line x1="44" y1="6.5" x2="56" y2="6.5" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Home indicator bar -->
    <line x1="38" y1="183" x2="62" y2="183" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Brand watermark/badge (Top Left) -->
  <g transform="translate(24, 30)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" letter-spacing="2">IQOO</text>
  </g>

  <!-- 5G Badge (Top Right) -->
  <g transform="translate(332, 22)">
    <rect width="44" height="18" rx="9" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="22" y="12.5" fill="#f97316" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.5">5G</text>
  </g>

  <!-- Bottom Info Section -->
  <g transform="translate(24, 256)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="700" letter-spacing="-0.3">iQOO Z10x 5G</text>
    <text x="0" y="18" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="500">6500 mAh • Dimensity 7300</text>
  </g>
</svg>